<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Web</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5f7;
    --fg: #1a1b1e;
    --fg-muted: #6b7280;
    --fg-soft: #8b929c;
    --bar-bg: #ffffff;
    --bar-border: #e2e5ea;
    --bar-shadow: 0 -4px 16px rgba(0,0,0,.06);
    --input-bg: #f4f5f7;
    --input-border: #d0d5dd;
    --input-fg: #1a1b1e;
    --accent: #3b6cf5;
    --accent-soft: #4f7cff;
    --btn-secondary: #e8eaee;
    --btn-secondary-fg: #3a3f47;
    --btn-disabled: #c5cad3;
    --md-heading: #1a2332;
    --md-border: #dde1e8;
    --md-strong: #111;
    --code-bg: #eef0f4;
    --code-fg: #1a6aa8;
    --pre-bg: #f0f2f5;
    --pre-border: #dde1e8;
    --pre-code: #2a2e35;
    --quote-border: #c5cad3;
    --quote-fg: #6b7280;
    --table-border: #c5cad3;
    --table-th-bg: #eef0f4;
    --table-th-fg: #1a2332;
    --table-alt: #f7f8fa;
    --tool-fg: #1a5a9e;
    --tool-bg: #e4eef9;
    --tool-result-fg: #5a6570;
    --tool-result-border: #c5cad3;
    --err: #d1242f;
    --spin-fg: #6b7280;
    --spin-ring: #c5cad3;
    --spin-top: #3b6cf5;
    --theme-btn-bg: #ffffff;
    --theme-btn-border: #d0d5dd;
    --theme-btn-fg: #3a3f47;
    --prompt-bg: #e8eefb;
    --prompt-border: #3b6cf5;
    --prompt-fg: #1a2332;
    --prompt-label-bg: #3b6cf5;
    --prompt-label-fg: #fff;
    --reply-label-fg: #6b7280;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1b1e;
    --fg: #e6e6e6;
    --fg-muted: #6f7680;
    --fg-soft: #5a6068;
    --bar-bg: #111214;
    --bar-border: #2a2c30;
    --bar-shadow: 0 -4px 16px rgba(0,0,0,.3);
    --input-bg: #222;
    --input-border: #333;
    --input-fg: #eee;
    --accent: #4f7cff;
    --accent-soft: #8fa9ff;
    --btn-secondary: #3a3f47;
    --btn-secondary-fg: #fff;
    --btn-disabled: #555;
    --md-heading: #dfe6ff;
    --md-border: #333;
    --md-strong: #fff;
    --code-bg: #2a2c30;
    --code-fg: #7ec8ff;
    --pre-bg: #0e0f11;
    --pre-border: #2a2c30;
    --pre-code: #d6dae0;
    --quote-border: #3a4252;
    --quote-fg: #9aa4b2;
    --table-border: #3a4252;
    --table-th-bg: #20242c;
    --table-th-fg: #dfe6ff;
    --table-alt: #1e2126;
    --tool-fg: #7ec8ff;
    --tool-bg: #20304a;
    --tool-result-fg: #9aa4b2;
    --tool-result-border: #3a4252;
    --err: #ff7b72;
    --spin-fg: #8a93a3;
    --spin-ring: #3a4252;
    --spin-top: #8fa9ff;
    --theme-btn-bg: #222;
    --theme-btn-border: #3a4252;
    --theme-btn-fg: #e6e6e6;
    --prompt-bg: #1e2a3d;
    --prompt-border: #4f7cff;
    --prompt-fg: #e8edf5;
    --prompt-label-bg: #4f7cff;
    --prompt-label-fg: #fff;
    --reply-label-fg: #8a93a3;
  }

  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  #themeBtn { position:fixed; top:12px; right:16px; z-index:20;
              width:36px; height:36px; padding:0; border-radius:50%;
              border:1px solid var(--theme-btn-border); background:var(--theme-btn-bg);
              color:var(--theme-btn-fg); cursor:pointer; font-size:16px; line-height:1;
              box-shadow:0 2px 8px rgba(0,0,0,.08); }
  #themeBtn:hover { border-color:var(--accent); }
  #themeBtn .icon-dark { display:none; }
  [data-theme="dark"] #themeBtn .icon-light { display:none; }
  [data-theme="dark"] #themeBtn .icon-dark { display:inline; }

  #log { padding:16px; padding-bottom:120px; min-height:100vh; box-sizing:border-box; }

  /* 底部固定输入区 */
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:10;
         padding:10px 16px 12px;
         background:var(--bar-bg); border-top:1px solid var(--bar-border);
         box-shadow:var(--bar-shadow); }
  #row { display:flex; gap:8px; align-items:flex-end; }

  /* 自动增高的多行输入框 */
  #prompt { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--input-border);
            background:var(--input-bg); color:var(--input-fg); resize:none; overflow-y:auto;
            font:14px/1.6 "SF Mono", Menlo, Consolas, monospace;
            min-height:24px; max-height:40vh; box-sizing:border-box; }
  #prompt:focus { outline:none; border-color:var(--accent); }

  button { padding:10px 18px; border-radius:10px; border:0; background:var(--accent);
           color:#fff; cursor:pointer; font:inherit; white-space:nowrap; }
  button:disabled { background:var(--btn-disabled); cursor:not-allowed; }
  #newBtn { background:var(--btn-secondary); color:var(--btn-secondary-fg); padding:10px 14px; }
  .hint { color:var(--fg-soft); font-size:12px; margin-top:6px;
          font-family:"SF Mono",Menlo,Consolas,monospace; }

  .turn { margin:0 0 24px; }
  .prompt-line { background:var(--prompt-bg); border-left:3px solid var(--prompt-border);
                 border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:14px;
                 white-space:pre-wrap; }
  .prompt-label { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.04em;
                  text-transform:uppercase; padding:2px 8px; border-radius:4px; margin-bottom:6px;
                  background:var(--prompt-label-bg); color:var(--prompt-label-fg);
                  font-family:"SF Mono",Menlo,Consolas,monospace; }
  .prompt-text { color:var(--prompt-fg); font-family:"SF Mono",Menlo,Consolas,monospace;
                 line-height:1.6; }
  .reply { margin-top:4px; }
  .reply-label { display:block; font-size:11px; font-weight:600; letter-spacing:.04em;
                 text-transform:uppercase; color:var(--reply-label-fg); margin-bottom:6px;
                 font-family:"SF Mono",Menlo,Consolas,monospace; }

  .md { color:var(--fg); }
  .md h1,.md h2,.md h3 { color:var(--md-heading); margin:16px 0 8px; line-height:1.4; }
  .md h1 { font-size:20px; border-bottom:1px solid var(--md-border); padding-bottom:4px; }
  .md h2 { font-size:18px; }
  .md h3 { font-size:16px; }
  .md p { margin:8px 0; }
  .md ul,.md ol { margin:8px 0; padding-left:22px; }
  .md li { margin:3px 0; }
  .md strong { color:var(--md-strong); }
  .md code { background:var(--code-bg); padding:1px 6px; border-radius:4px;
             font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px; color:var(--code-fg); }
  .md pre { background:var(--pre-bg); border:1px solid var(--pre-border); border-radius:8px;
            padding:12px; overflow:auto; }
  .md pre code { background:none; padding:0; color:var(--pre-code); }
  .md a { color:var(--accent); }
  .md blockquote { border-left:3px solid var(--quote-border); margin:8px 0; padding:2px 12px; color:var(--quote-fg); }
  .md table { border-collapse:collapse; margin:10px 0; }
  .md th,.md td { border:1px solid var(--table-border); padding:6px 12px; text-align:left; }
  .md th { background:var(--table-th-bg); color:var(--table-th-fg); }
  .md tr:nth-child(even) td { background:var(--table-alt); }

  .tool { color:var(--tool-fg); background:var(--tool-bg); border-radius:6px;
          padding:6px 10px; margin:8px 0; display:block;
          font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .tool.open { white-space:pre-wrap; overflow:visible; text-overflow:clip; }
  .tool-result { color:var(--tool-result-fg); border-left:3px solid var(--tool-result-border);
                 padding:4px 10px; margin:4px 0 10px; display:block;
                 font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .tool-result.open { white-space:pre-wrap; overflow:visible; text-overflow:clip; max-height:none; }
  .meta { color:var(--fg-muted); font-family:"SF Mono",Menlo,Consolas,monospace; }
  .err { color:var(--err); white-space:pre-wrap; }
  .cursor::after { content:'\2589'; animation: blink 1s step-start infinite; color:var(--accent-soft); }
  @keyframes blink { 50% { opacity:0; } }

  /* 等待模型输出时的转圈指示 */
  .spin { display:flex; align-items:center; gap:8px; color:var(--spin-fg); margin:8px 0;
          font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px; }
  .spin::before { content:''; width:13px; height:13px; border-radius:50%; flex:none;
          border:2px solid var(--spin-ring); border-top-color:var(--spin-top);
          animation:spin-rot .8s linear infinite; }
  @keyframes spin-rot { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<button id="themeBtn" type="button" title="切换亮/暗色模式" aria-label="切换亮/暗色模式">
  <span class="icon-light">☀</span><span class="icon-dark">☾</span>
</button>
<div id="log"></div>

<div id="bar">
  <div id="row">
    <button id="newBtn" onclick="newSession()" title="新建会话（清空上下文）">＋</button>
    <textarea id="prompt" rows="1"
      placeholder="描述会议问题，例如：Jack Chen 最近的会议质量怎么样？"></textarea>
    <button id="btn" onclick="run()">查询</button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · ＋ 新建会话</div>
</div>

<script>
marked.setOptions({ breaks: true, gfm: true });

const log = document.getElementById('log');
const btn = document.getElementById('btn');
const promptEl = document.getElementById('prompt');
const themeBtn = document.getElementById('themeBtn');

/* ---------- 主题：默认 light，记住选择 ---------- */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  themeBtn.title = theme === 'dark' ? '切换到亮色模式' : '切换到暗色模式';
}
applyTheme(localStorage.getItem('theme') === 'light' ? 'light' : 'dark');
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

// 会话 id：sessionStorage —— 每个标签页独立，刷新不丢
let sessionId = sessionStorage.getItem('sid');
if (!sessionId) {
  sessionId = 'tab-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
  sessionStorage.setItem('sid', sessionId);
}

let es = null, mdBuffer = '', mdEl = null;

/* ---------- 输入框：自动增高 ---------- */
function autoGrow() {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, window.innerHeight * 0.4) + 'px';
  document.getElementById('log').style.paddingBottom =
    (document.getElementById('bar').offsetHeight + 24) + 'px';
}
promptEl.addEventListener('input', autoGrow);

/* ---------- 键盘：Enter 发送 / Shift+Enter 换行 ---------- */
promptEl.addEventListener('keydown', (e) => {
  // 中文输入法组合中不拦截
  if (e.isComposing) return;
  if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    run();
  }
  // Shift+Enter / Cmd+Enter / Ctrl+Enter → 默认行为（换行）
});

/* ---------- 渲染工具 ---------- */
// 粘底：默认贴着底部；用户主动上滚后停止强制滚动，滚回底部附近再恢复
let stickToBottom = true;
window.addEventListener('scroll', () => {
  stickToBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
}, { passive: true });
function scrollDown() { if (stickToBottom) window.scrollTo(0, document.body.scrollHeight); }
function renderMd() {
  if (!mdEl) return;
  mdEl.innerHTML = DOMPurify.sanitize(marked.parse(mdBuffer));
  scrollDown();
}

function newSession() {
  if (es) { es.close(); es = null; btn.disabled = false; }
  sessionId = 'tab-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
  sessionStorage.setItem('sid', sessionId);
  log.innerHTML = '';
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = '— 已开启新会话 —';
  log.appendChild(m);
  promptEl.focus();
}

function run() {
  const p = promptEl.value.trim();
  if (!p) return;
  if (es) es.close();
  document.querySelectorAll('.spin').forEach(el => el.remove()); // 清掉上一轮可能残留的转圈

  promptEl.value = '';
  autoGrow();               // 清空后收回单行高度
  promptEl.focus();
  btn.disabled = true;
  stickToBottom = true;     // 新一轮查询：恢复粘底

  const turn = document.createElement('div');
  turn.className = 'turn';
  const pl = document.createElement('div');
  pl.className = 'prompt-line';
  const label = document.createElement('div');
  label.className = 'prompt-label';
  label.textContent = 'You';
  const text = document.createElement('div');
  text.className = 'prompt-text';
  text.textContent = p;
  pl.appendChild(label);
  pl.appendChild(text);
  turn.appendChild(pl);
  log.appendChild(turn);

  mdBuffer = ''; mdEl = null;

  // \u7B49\u5F85\u6307\u793A\uFF1AappendChild \u4F1A\u628A\u5DF2\u5B58\u5728\u7684\u8282\u70B9\u79FB\u5230\u672B\u5C3E\uFF0C\u4FDD\u8BC1\u8F6C\u5708\u59CB\u7EC8\u5728\u6700\u4E0B\u65B9
  const spin = document.createElement('div');
  spin.className = 'spin';
  const showSpin = (label) => { spin.textContent = label; spin.style.display = 'flex'; turn.appendChild(spin); scrollDown(); };
  const hideSpin = () => { spin.style.display = 'none'; };
  showSpin('\u601D\u8003\u4E2D\u2026');
  scrollDown();

  es = new EventSource('/api/run?prompt=' + encodeURIComponent(p) + '&session=' + sessionId);

  es.addEventListener('init', e => {
    const d = JSON.parse(e.data);
    const m = document.createElement('div');
    m.className = 'meta'; m.textContent = '[model: ' + d.model + ']';
    turn.appendChild(m); turn.appendChild(spin); scrollDown();
  });

  es.addEventListener('thinking', () => showSpin('\u601D\u8003\u4E2D\u2026'));

  es.addEventListener('delta', e => {
    hideSpin();
    const d = JSON.parse(e.data);
    if (!mdEl) {
      const reply = document.createElement('div');
      reply.className = 'reply';
      const rl = document.createElement('div');
      rl.className = 'reply-label';
      rl.textContent = 'Assistant';
      mdEl = document.createElement('div');
      mdEl.className = 'md';
      reply.appendChild(rl);
      reply.appendChild(mdEl);
      turn.appendChild(reply);
    }
    mdBuffer += d.text;
    renderMd();
  });

  es.addEventListener('tool', e => {
    const d = JSON.parse(e.data);
    mdEl = null; mdBuffer = '';
    const el = document.createElement('div');
    el.className = 'tool';
    el.title = '\u70B9\u51FB\u5C55\u5F00/\u6536\u8D77';
    el.textContent = '\uD83D\uDD27 ' + d.name + '\n' + JSON.stringify(d.input, null, 2);
    el.addEventListener('click', () => el.classList.toggle('open'));
    turn.appendChild(el);
    showSpin('\u5DE5\u5177\u6267\u884C\u4E2D\u2026');
  });

  es.addEventListener('tool_result', e => {
    const el = document.createElement('div');
    el.className = 'tool-result';
    el.title = '\u70B9\u51FB\u5C55\u5F00/\u6536\u8D77';
    el.textContent = JSON.parse(e.data).text;
    el.addEventListener('click', () => el.classList.toggle('open'));
    turn.appendChild(el);
    showSpin('\u601D\u8003\u4E2D\u2026');
  });

  es.addEventListener('stderr', e => {
    const el = document.createElement('div');
    el.className = 'err'; el.textContent = JSON.parse(e.data).text;
    turn.appendChild(el); scrollDown();
  });

  es.addEventListener('done', e => {
    const d = JSON.parse(e.data);
    spin.remove();
    renderMd();
    const el = document.createElement('div');
    el.className = d.is_error ? 'err' : 'meta';
    const tokens = (d.usage?.input_tokens || 0) + (d.usage?.output_tokens || 0);
    el.textContent = '[完成 ' + (d.duration_ms/1000).toFixed(1) + 's | ' + tokens + ' tokens]';
    turn.appendChild(el); scrollDown();
  });

  es.addEventListener('exit', () => { spin.remove(); es.close(); es = null; btn.disabled = false; promptEl.focus(); });
  es.onerror = () => { spin.remove(); btn.disabled = false; };
}

autoGrow();
promptEl.focus();
</script>
</body>
</html>
